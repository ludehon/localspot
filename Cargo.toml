[package]
name = "localspot"
version = "0.1.0"
edition = "2024"

[dependencies]
librespot = { git = "https://github.com/librespot-org/librespot.git"}
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.21"